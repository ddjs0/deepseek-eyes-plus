[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-eyes"
version = "1.1.0"
description = "给 DeepSeek 装上眼睛 — MCP Server + 通义千问VL, 剪贴板/文件媒体(图片/音频/视频) → 视觉模型 → 文字描述 / Give DeepSeek the ability to see via clipboard/file media (image/audio/video) + Qwen-VL"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Shaohan He" }, { name = "Capetlevrai (original)" }]
keywords = ["mcp", "vision", "clipboard", "deepseek", "qwen-vl", "modelscope", "llm", "claude-code"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = [
  "mcp>=1.0,<2.0",
  "openai>=1.0.0",
  "aiofiles>=23.0.0",
  "Pillow>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/ddjs0/deepseek-eyes"
Repository = "https://github.com/ddjs0/deepseek-eyes"
Issues = "https://github.com/ddjs0/deepseek-eyes/issues"

[project.scripts]
deepseek-eyes = "deepseek_eyes.server:run"

[tool.setuptools.packages.find]
include = ["deepseek_eyes*"]
exclude = ["examples*", "docs*", "tests*"]
